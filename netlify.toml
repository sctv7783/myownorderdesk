[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/lib/**"]

[functions."ai-simulate"]
  timeout = 26

[functions."whatsapp-webhook"]
  timeout = 26

[functions."inbox"]
  timeout = 26

[functions."orders"]
  timeout = 26

[functions."products-import"]
  timeout = 26

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

